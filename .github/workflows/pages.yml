name: Deploy Web Synth to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install WebAssembly compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang lld

      - name: Build and test
        run: |
          WASM_CLANG=clang++ make wasm
          make test
          node --test shells/web/tests/index.mjs

      - name: Browser context recreation safety
        env:
          CHROME_BIN: google-chrome
          CHROMEDRIVER_BIN: chromedriver
        run: make browser-context-recreate-check

      - name: Assemble public site
        run: |
          install -d _site/shells/web _site/presets _site/build
          cp pages/index.html _site/index.html
          cp shells/web/synth.html shells/web/synth-ui.css _site/shells/web/
          cp \
            shells/web/synth-ui.js \
            shells/web/synth-node.js \
            shells/web/synth-worklet.js \
            shells/web/space-effects.js \
            shells/web/mod-matrix.js \
            shells/web/fx-rack.js \
            shells/web/patch-state.js \
            shells/web/patch-bank.js \
            shells/web/preset-collection.js \
            shells/web/sound-analysis.js \
            shells/web/match-audio.js \
            shells/web/envelope-match.js \
            shells/web/filter-match.js \
            shells/web/eq-response.js \
            shells/web/numeric-control.js \
            shells/web/fx-controls.js \
            shells/web/patch-load-state.js \
            shells/web/note-registry.js \
            shells/web/keyboard-input.js \
            shells/web/wavetable-import.js \
            _site/shells/web/
          cp presets/*.txt _site/presets/
          cp build/synth_engine.wasm _site/build/
          test -s _site/build/synth_engine.wasm
          test -s _site/shells/web/eq-response.js
          test -s _site/shells/web/patch-bank.js
          test -s _site/shells/web/preset-collection.js
          test "$(find _site -type l | wc -l)" -eq 0
          sha256sum _site/build/synth_engine.wasm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
